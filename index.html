<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Model Chat Desk</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><header>SurfingCoder / Local AI <a href="https://github.com/netcodermike/local-model-chat-desk">Source ↗</a></header><main><div class="eyebrow">Your computer. Your model.</div><h1>Local Model Chat Desk</h1><p>Prompts go only to the Ollama server on this computer.</p><div class="workspace"><section class="panel"><label for="model">Installed model</label><select id="model"></select><button id="refresh">Refresh models</button><label for="prompt">Message</label><textarea id="prompt" placeholder="Ask your local model…"></textarea><button id="send">Send message</button><button id="clear">Clear conversation</button><button id="export">Export JSON</button><p id="status" role="status"></p></section><section class="panel"><h2>Conversation</h2><div id="conversation"><p>Start Ollama to begin. No hosted AI account is needed.</p></div></section></div></main></body></html>
